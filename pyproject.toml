[project]
name = "akeneo_mock_server"
version = "0.9.0"
description = "This implements an API that's compatible to Akeneo. If it's not, it's a bug. This is NOT an official Akeneo Product"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.159.1",
  "httpx>=0.28.1",
  "persist-queue[extra]>=1.1.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.14.1",
  "sqlglot>=30.24.0",
]
[project.optional-dependencies]
run = [
    "uvicorn>=0.54.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "docker>=7.2.0",
]
dev = [
  "uvicorn>=0.54.0",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
  "schemathesis>=4.32.3",
  "pyright>=1.1.414",
  "skillup>=0.7.3",
]

[tool.pyright]
venv = ".venv"
venvPath = "."
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["akeneo_mock_server"]
exclude = ["tests", "examples", "pim-api-docs"]
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportReturnType = "none"

[tool.ruff]
line-length = 119
indent-width = 4
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.sqlfmt]
line_length = 119

[project.scripts]
run_akeneo_mock = "akeneo_mock_server.__main__:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "akeneo_mock_server"
module-root = ""


[tool.pytest.ini_options]
pythonpath = ["."]


[[tool.uv.index]]
name = "BMSAzureDevOps"
url = "https://VssSessionToken@pkgs.dev.azure.com/bmeurope/_packaging/BMS/pypi/simple/"
explicit = true
publish-url = "https://pkgs.dev.azure.com/bmeurope/_packaging/BMS/pypi/upload/"

[tool.uv]
native-tls = true
