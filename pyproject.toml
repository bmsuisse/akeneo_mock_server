[project]
name = "akeneo_mock_server"
version = "0.9.0"
description = "This implements an API that's compatible to Akeneo. If it's not, it's a bug. This is NOT an official Akeneo Product"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.159.1",
  "httpx>=0.28.1",
  "persist-queue[extra]>=1.1.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.14.1",
  "sqlglot>=30.24.0",
]
[project.optional-dependencies]
run = [
    "uvicorn>=0.54.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "docker>=7.2.0",
]
dev = [
  "uvicorn>=0.54.0",
  "pytest>=9.1.1",
  "ruff>=0.17.4",
  "schemathesis>=4.32.3",
  "pyright>=1.1.414",
  "skillup>=0.7.3",
  "ty>=0.0.100",
]

[tool.pyright]
venv = ".venv"
venvPath = "."
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["akeneo_mock_server"]
exclude = ["tests", "examples", "pim-api-docs"]
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportReturnType = "none"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
extend-exclude = ["*.md", ".worktrees", ".claude", "pim-api-docs"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", "F", "I",   # pycodestyle, pyflakes, isort
    "UP",            # pyupgrade - X | None, modern syntax
    "B",             # bugbear - mutable defaults etc.
    "ANN",           # full type annotations
    "SIM", "C4",     # simplifiable code, needless comprehensions/casts
    "PERF", "FURB",  # needless loops, manual list/dict building
    "ASYNC",         # blocking calls inside async def
    "FAST",          # FastAPI: Annotated deps, redundant response_model
    "RUF",
    "N",             # PEP 8 naming
    "PTH",           # pathlib instead of os.path
    "TID",           # absolute imports only, banned APIs
    "RET", "PIE",    # consistent returns, misc simplifications
    "A",             # no shadowing builtins
    "T20",           # no print()
    "LOG",           # logging API misuse
    "DTZ",           # timezone-aware datetimes
    "FLY",           # f-string instead of str.join on literals
    "PLE", "PLW",    # pylint errors + warnings
]
ignore = ["ANN401"]  # `Any` is a warning via the ruff-warn-any prek hook, not an error

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = [".worktrees", ".claude", "pim-api-docs"]

[tool.sqlfmt]
line_length = 119

[project.scripts]
run_akeneo_mock = "akeneo_mock_server.__main__:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "akeneo_mock_server"
module-root = ""


[tool.pytest.ini_options]
pythonpath = ["."]


[[tool.uv.index]]
name = "BMSAzureDevOps"
url = "https://VssSessionToken@pkgs.dev.azure.com/bmeurope/_packaging/BMS/pypi/simple/"
explicit = true
publish-url = "https://pkgs.dev.azure.com/bmeurope/_packaging/BMS/pypi/upload/"

[tool.uv]
native-tls = true
exclude-newer = "5 days"
exclude-newer-package = { skillup = false }
