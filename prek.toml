# prek.toml — pre-commit formatter configuration
# Install git hook: prek install
# Format all files: prek run --all-files

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-yaml", exclude = '^pim-api-docs/' },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.4"
hooks = [
    { id = "ruff-check", args = ["--fix"], exclude = '^pim-api-docs/' },
    { id = "ruff-format", exclude = '^pim-api-docs/' },
]

[[repos]]
repo = "local"
hooks = [
    { id = "ruff-warn-any", name = "ruff warn: typing.Any (ANN401)", language = "system", entry = "uv run ruff check --select ANN401 --exit-zero --output-format concise", types = ["python"], exclude = '^pim-api-docs/', verbose = true },
    { id = "ty", name = "ty check", language = "system", entry = "uv run --all-groups ty check", types = ["python"], exclude = '^pim-api-docs/', pass_filenames = false },
]

[[repos]]
repo = "local"
hooks = [
    { id = "sqlfmt", name = "sqlfmt", language = "system", entry = "uv run sqlfmt", files = '\\.sql$' },
]

[[repos]]
repo = "local"
hooks = [
    { id = "prettier", name = "prettier", language = "system", entry = "bunx --bun prettier --write", files = '\\.(ts|tsx|js|jsx|vue)$' },
]

[[repos]]
repo = "local"
hooks = [
    { id = "pyright", name = "pyright", language = "system", entry = "uv run pyright", files = '\\.py$' },
]
